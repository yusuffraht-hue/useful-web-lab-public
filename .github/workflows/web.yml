name: Build, preview, and release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 16 * * *'
permissions:
  contents: read
concurrency:
  group: web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:browser
      - uses: actions/upload-pages-artifact@v5
        if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' && github.event_name != 'pull_request' && vars.RELEASE_TARGET == 'github-pages' }}
        with:
          path: dist/site

  deploy:
    needs: verify
    if: ${{ github.ref == 'refs/heads/main' && github.event_name != 'schedule' && github.event_name != 'pull_request' && vars.RELEASE_TARGET == 'github-pages' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deploy

